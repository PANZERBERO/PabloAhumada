<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌟 Experiencia Cósmica Móvil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #canvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 70%);
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .title {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: #00ffff;
            font-size: 1.8rem;
            font-weight: 900;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: pulse 2s ease-in-out infinite alternate;
            text-align: center;
        }
        
        .subtitle {
            position: absolute;
            top: 70px;
            left: 20px;
            right: 20px;
            color: #ff6b6b;
            font-size: 1rem;
            font-weight: 400;
            text-shadow: 0 0 10px #ff6b6b;
            animation: glow 3s ease-in-out infinite alternate;
            text-align: center;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #ffffff;
            font-size: 0.8rem;
            opacity: 0.8;
            animation: fadeIn 3s ease-in;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }
        
        .stats {
            position: absolute;
            top: 110px;
            left: 20px;
            right: 20px;
            color: #4ecdc4;
            font-size: 0.7rem;
            text-align: center;
            text-shadow: 0 0 5px #4ecdc4;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 5px;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        
        @keyframes glow {
            0% { text-shadow: 0 0 10px #ff6b6b; }
            100% { text-shadow: 0 0 20px #ff6b6b, 0 0 30px #ff6b6b; }
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 0.8; }
        }
        
        .touch-indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid #00ffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 0 30px #00ffff;
            animation: touchPulse 0.3s ease-out;
            transform: scale(0);
        }
        
        @keyframes touchPulse {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 10px;
            border-radius: 50%;
            font-size: 1.2rem;
            pointer-events: all;
            cursor: pointer;
            z-index: 200;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="ui-overlay">
        <div class="title">🌟 EXPERIENCIA CÓSMICA 🌟</div>
        <div class="subtitle">Red Neural Interactiva Móvil</div>
        <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
        <div class="stats" id="stats">
            Partículas: <span id="particleCount">0</span> | 
            Conexiones: <span id="connectionCount">0</span> | 
            FPS: <span id="fps">60</span>
        </div>
        <div class="controls">
            👆 Toca para explosiones de partículas<br>
            🖐️ Mantén presionado para atraer<br>
            ✨ Desliza para interactuar
        </div>
    </div>

    <script>
        class MobileCosmicExperience {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.connections = [];
                this.touches = new Map();
                this.time = 0;
                this.maxParticles = 120; // Reducido para móviles
                this.connectionDistance = 120; // Reducido para móviles
                
                this.colors = [
                    '#00ffff', '#ff6b6b', '#4ecdc4', '#45b7d1', 
                    '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7',
                    '#a29bfe', '#fd79a8', '#00b894', '#00cec9'
                ];
                
                this.init();
                this.createInitialParticles();
                this.bindEvents();
                this.animate();
                this.updateStats();
            }
            
            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('orientationchange', () => {
                    setTimeout(() => this.resize(), 100);
                });
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            createInitialParticles() {
                const count = Math.min(60, Math.floor((this.canvas.width * this.canvas.height) / 15000));
                for (let i = 0; i < count; i++) {
                    this.particles.push(new MobileParticle(
                        Math.random() * this.canvas.width,
                        Math.random() * this.canvas.height,
                        this.colors[Math.floor(Math.random() * this.colors.length)]
                    ));
                }
            }
            
            bindEvents() {
                // Touch events
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    for (let touch of e.changedTouches) {
                        this.touches.set(touch.identifier, {
                            x: touch.clientX,
                            y: touch.clientY,
                            startTime: Date.now()
                        });
                        this.createTouchIndicator(touch.clientX, touch.clientY);
                        this.createExplosion(touch.clientX, touch.clientY);
                    }
                });
                
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for (let touch of e.changedTouches) {
                        if (this.touches.has(touch.identifier)) {
                            this.touches.set(touch.identifier, {
                                x: touch.clientX,
                                y: touch.clientY,
                                startTime: this.touches.get(touch.identifier).startTime
                            });
                        }
                    }
                });
                
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    for (let touch of e.changedTouches) {
                        this.touches.delete(touch.identifier);
                    }
                });
                
                // Prevent default behaviors
                document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
                document.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
                document.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });
            }
            
            createTouchIndicator(x, y) {
                const indicator = document.createElement('div');
                indicator.className = 'touch-indicator';
                indicator.style.left = (x - 30) + 'px';
                indicator.style.top = (y - 30) + 'px';
                document.body.appendChild(indicator);
                
                setTimeout(() => {
                    document.body.removeChild(indicator);
                }, 300);
            }
            
            createExplosion(x, y) {
                const explosionCount = 10; // Reducido para móviles
                for (let i = 0; i < explosionCount; i++) {
                    const angle = (Math.PI * 2 * i) / explosionCount;
                    const speed = Math.random() * 4 + 1;
                    const particle = new MobileParticle(x, y, this.colors[Math.floor(Math.random() * this.colors.length)]);
                    particle.vx = Math.cos(angle) * speed;
                    particle.vy = Math.sin(angle) * speed;
                    particle.life = 1.0;
                    particle.decay = 0.03;
                    particle.size = Math.random() * 3 + 1;
                    this.particles.push(particle);
                }
            }
            
            updateParticles() {
                // Add new particles based on touch interaction
                for (let [id, touch] of this.touches) {
                    const holdTime = Date.now() - touch.startTime;
                    if (holdTime > 100 && this.particles.length < this.maxParticles) {
                        this.particles.push(new MobileParticle(
                            touch.x + (Math.random() - 0.5) * 30,
                            touch.y + (Math.random() - 0.5) * 30,
                            this.colors[Math.floor(Math.random() * this.colors.length)]
                        ));
                    }
                }
                
                // Update existing particles
                this.particles = this.particles.filter(particle => {
                    particle.update(this.touches, this.time);
                    return particle.life > 0;
                });
                
                // Maintain minimum particle count
                while (this.particles.length < 40) {
                    this.particles.push(new MobileParticle(
                        Math.random() * this.canvas.width,
                        Math.random() * this.canvas.height,
                        this.colors[Math.floor(Math.random() * this.colors.length)]
                    ));
                }
            }
            
            updateConnections() {
                this.connections = [];
                const maxConnections = 100; // Límite para rendimiento móvil
                
                for (let i = 0; i < this.particles.length && this.connections.length < maxConnections; i++) {
                    for (let j = i + 1; j < this.particles.length && this.connections.length < maxConnections; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.connectionDistance) {
                            this.connections.push({
                                p1: this.particles[i],
                                p2: this.particles[j],
                                distance: distance,
                                strength: 1 - (distance / this.connectionDistance)
                            });
                        }
                    }
                }
            }
            
            render() {
                // Clear canvas with fade effect
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw connections
                this.connections.forEach(connection => {
                    this.ctx.strokeStyle = connection.p1.color + '60';
                    this.ctx.lineWidth = connection.strength * 1.5;
                    this.ctx.beginPath();
                    this.ctx.moveTo(connection.p1.x, connection.p1.y);
                    this.ctx.lineTo(connection.p2.x, connection.p2.y);
                    this.ctx.stroke();
                });
                
                // Draw particles
                this.particles.forEach(particle => {
                    particle.render(this.ctx);
                });
                
                // Draw touch influence fields
                for (let [id, touch] of this.touches) {
                    const holdTime = Date.now() - touch.startTime;
                    if (holdTime > 100) {
                        const gradient = this.ctx.createRadialGradient(
                            touch.x, touch.y, 0,
                            touch.x, touch.y, 80
                        );
                        gradient.addColorStop(0, 'rgba(0, 255, 255, 0.15)');
                        gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
                        
                        this.ctx.fillStyle = gradient;
                        this.ctx.beginPath();
                        this.ctx.arc(touch.x, touch.y, 80, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
            }
            
            updateStats() {
                document.getElementById('particleCount').textContent = this.particles.length;
                document.getElementById('connectionCount').textContent = this.connections.length;
            }
            
            animate() {
                this.time += 0.02;
                
                this.updateParticles();
                this.updateConnections();
                this.render();
                this.updateStats();
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        class MobileParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.originalX = x;
                this.originalY = y;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.color = color;
                this.size = Math.random() * 3 + 1.5;
                this.life = 1.0;
                this.decay = 0.0005;
                this.phase = Math.random() * Math.PI * 2;
                this.orbitRadius = Math.random() * 30 + 15;
                this.orbitSpeed = Math.random() * 0.03 + 0.01;
            }
            
            update(touches, time) {
                // Touch attraction/repulsion
                for (let [id, touch] of touches) {
                    const dx = touch.x - this.x;
                    const dy = touch.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 150) {
                        const force = (150 - distance) / 150;
                        const holdTime = Date.now() - touch.startTime;
                        
                        if (holdTime > 100) {
                            // Attract to touch when held
                            this.vx += (dx / distance) * force * 0.4;
                            this.vy += (dy / distance) * force * 0.4;
                        } else {
                            // Repel from touch
                            this.vx -= (dx / distance) * force * 0.3;
                            this.vy -= (dy / distance) * force * 0.3;
                        }
                    }
                }
                
                // Orbital motion around original position
                this.phase += this.orbitSpeed;
                const orbitX = this.originalX + Math.cos(this.phase + time) * this.orbitRadius;
                const orbitY = this.originalY + Math.sin(this.phase + time) * this.orbitRadius;
                
                // Blend orbital motion with current velocity
                this.vx += (orbitX - this.x) * 0.008;
                this.vy += (orbitY - this.y) * 0.008;
                
                // Apply velocity with damping
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.x += this.vx;
                this.y += this.vy;
                
                // Boundary wrapping
                if (this.x < 0) this.x = window.innerWidth;
                if (this.x > window.innerWidth) this.x = 0;
                if (this.y < 0) this.y = window.innerHeight;
                if (this.y > window.innerHeight) this.y = 0;
                
                // Life decay
                this.life -= this.decay;
                if (this.life < 0) this.life = 0;
            }
            
            render(ctx) {
                const alpha = this.life;
                
                // Outer glow (simplified for mobile)
                ctx.fillStyle = this.color + '40';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Core particle
                ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner highlight
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (alpha * 0.6) + ')';
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // FPS Counter
        let fps = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        
        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
            requestAnimationFrame(updateFPS);
        }
        
        // Fullscreen function
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Error attempting to enable fullscreen:', err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        // Initialize the experience
        window.addEventListener('load', () => {
            new MobileCosmicExperience();
            updateFPS();
        });
        
        // Prevent zoom and scroll
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('gesturechange', e => e.preventDefault());
        document.addEventListener('gestureend', e => e.preventDefault());
    </script>
</body>
</html>
