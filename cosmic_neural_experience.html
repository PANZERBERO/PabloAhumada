<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Cósmica Neural - Pablo Ahumada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background: #000;
            overflow: hidden;
            cursor: none;
        }
        
        #canvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 70%);
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .title {
            position: absolute;
            top: 50px;
            left: 50px;
            color: #00ffff;
            font-size: 2.5rem;
            font-weight: 900;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        
        .subtitle {
            position: absolute;
            top: 120px;
            left: 50px;
            color: #ff6b6b;
            font-size: 1.2rem;
            font-weight: 400;
            text-shadow: 0 0 10px #ff6b6b;
            animation: glow 3s ease-in-out infinite alternate;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50px;
            color: #ffffff;
            font-size: 0.9rem;
            opacity: 0.7;
            animation: fadeIn 3s ease-in;
        }
        
        .stats {
            position: absolute;
            top: 50px;
            right: 50px;
            color: #4ecdc4;
            font-size: 0.8rem;
            text-align: right;
            text-shadow: 0 0 5px #4ecdc4;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        
        @keyframes glow {
            0% { text-shadow: 0 0 10px #ff6b6b; }
            100% { text-shadow: 0 0 20px #ff6b6b, 0 0 30px #ff6b6b; }
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }
        
        .custom-cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 0 20px #00ffff;
            animation: cursorPulse 1s ease-in-out infinite;
        }
        
        @keyframes cursorPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="ui-overlay">
        <div class="title">EXPERIENCIA CÓSMICA</div>
        <div class="subtitle">Red Neural Interactiva 3D</div>
        <div class="controls">
            🎮 Mueve el mouse para interactuar<br>
            🌟 Click para crear explosiones de partículas<br>
            ⚡ Mantén presionado para efectos especiales
        </div>
        <div class="stats" id="stats">
            Partículas: <span id="particleCount">0</span><br>
            Conexiones: <span id="connectionCount">0</span><br>
            FPS: <span id="fps">60</span>
        </div>
    </div>
    
    <div class="custom-cursor" id="cursor"></div>

    <script>
        class CosmicNeuralExperience {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.connections = [];
                this.mouse = { x: 0, y: 0, pressed: false };
                this.time = 0;
                this.maxParticles = 200;
                this.connectionDistance = 150;
                
                this.colors = [
                    '#00ffff', '#ff6b6b', '#4ecdc4', '#45b7d1', 
                    '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7',
                    '#a29bfe', '#fd79a8', '#00b894', '#00cec9'
                ];
                
                this.init();
                this.createInitialParticles();
                this.bindEvents();
                this.animate();
                this.updateStats();
            }
            
            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            createInitialParticles() {
                for (let i = 0; i < 100; i++) {
                    this.particles.push(new Particle(
                        Math.random() * this.canvas.width,
                        Math.random() * this.canvas.height,
                        this.colors[Math.floor(Math.random() * this.colors.length)]
                    ));
                }
            }
            
            bindEvents() {
                // Mouse tracking
                document.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                    
                    // Update custom cursor
                    const cursor = document.getElementById('cursor');
                    cursor.style.left = (e.clientX - 10) + 'px';
                    cursor.style.top = (e.clientY - 10) + 'px';
                });
                
                document.addEventListener('mousedown', (e) => {
                    this.mouse.pressed = true;
                    this.createExplosion(e.clientX, e.clientY);
                });
                
                document.addEventListener('mouseup', () => {
                    this.mouse.pressed = false;
                });
                
                // Touch events for mobile
                document.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.mouse.x = touch.clientX;
                    this.mouse.y = touch.clientY;
                });
                
                document.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.createExplosion(touch.clientX, touch.clientY);
                });
            }
            
            createExplosion(x, y) {
                const explosionCount = 15;
                for (let i = 0; i < explosionCount; i++) {
                    const angle = (Math.PI * 2 * i) / explosionCount;
                    const speed = Math.random() * 5 + 2;
                    const particle = new Particle(x, y, this.colors[Math.floor(Math.random() * this.colors.length)]);
                    particle.vx = Math.cos(angle) * speed;
                    particle.vy = Math.sin(angle) * speed;
                    particle.life = 1.0;
                    particle.decay = 0.02;
                    this.particles.push(particle);
                }
            }
            
            updateParticles() {
                // Add new particles based on mouse interaction
                if (this.mouse.pressed && this.particles.length < this.maxParticles) {
                    this.particles.push(new Particle(
                        this.mouse.x + (Math.random() - 0.5) * 50,
                        this.mouse.y + (Math.random() - 0.5) * 50,
                        this.colors[Math.floor(Math.random() * this.colors.length)]
                    ));
                }
                
                // Update existing particles
                this.particles = this.particles.filter(particle => {
                    particle.update(this.mouse, this.time);
                    return particle.life > 0;
                });
                
                // Maintain minimum particle count
                while (this.particles.length < 80) {
                    this.particles.push(new Particle(
                        Math.random() * this.canvas.width,
                        Math.random() * this.canvas.height,
                        this.colors[Math.floor(Math.random() * this.colors.length)]
                    ));
                }
            }
            
            updateConnections() {
                this.connections = [];
                
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < this.connectionDistance) {
                            this.connections.push({
                                p1: this.particles[i],
                                p2: this.particles[j],
                                distance: distance,
                                strength: 1 - (distance / this.connectionDistance)
                            });
                        }
                    }
                }
            }
            
            render() {
                // Clear canvas with fade effect
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw connections
                this.connections.forEach(connection => {
                    const gradient = this.ctx.createLinearGradient(
                        connection.p1.x, connection.p1.y,
                        connection.p2.x, connection.p2.y
                    );
                    gradient.addColorStop(0, connection.p1.color + '40');
                    gradient.addColorStop(1, connection.p2.color + '40');
                    
                    this.ctx.strokeStyle = gradient;
                    this.ctx.lineWidth = connection.strength * 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(connection.p1.x, connection.p1.y);
                    this.ctx.lineTo(connection.p2.x, connection.p2.y);
                    this.ctx.stroke();
                });
                
                // Draw particles
                this.particles.forEach(particle => {
                    particle.render(this.ctx);
                });
                
                // Draw mouse influence field
                if (this.mouse.pressed) {
                    const gradient = this.ctx.createRadialGradient(
                        this.mouse.x, this.mouse.y, 0,
                        this.mouse.x, this.mouse.y, 100
                    );
                    gradient.addColorStop(0, 'rgba(0, 255, 255, 0.1)');
                    gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(this.mouse.x, this.mouse.y, 100, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }
            
            updateStats() {
                document.getElementById('particleCount').textContent = this.particles.length;
                document.getElementById('connectionCount').textContent = this.connections.length;
            }
            
            animate() {
                this.time += 0.01;
                
                this.updateParticles();
                this.updateConnections();
                this.render();
                this.updateStats();
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.originalX = x;
                this.originalY = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.color = color;
                this.size = Math.random() * 4 + 2;
                this.life = 1.0;
                this.decay = 0.001;
                this.phase = Math.random() * Math.PI * 2;
                this.orbitRadius = Math.random() * 50 + 20;
                this.orbitSpeed = Math.random() * 0.02 + 0.01;
            }
            
            update(mouse, time) {
                // Mouse attraction/repulsion
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 200) {
                    const force = (200 - distance) / 200;
                    if (mouse.pressed) {
                        // Attract to mouse when pressed
                        this.vx += (dx / distance) * force * 0.5;
                        this.vy += (dy / distance) * force * 0.5;
                    } else {
                        // Repel from mouse
                        this.vx -= (dx / distance) * force * 0.2;
                        this.vy -= (dy / distance) * force * 0.2;
                    }
                }
                
                // Orbital motion around original position
                this.phase += this.orbitSpeed;
                const orbitX = this.originalX + Math.cos(this.phase + time) * this.orbitRadius;
                const orbitY = this.originalY + Math.sin(this.phase + time) * this.orbitRadius;
                
                // Blend orbital motion with current velocity
                this.vx += (orbitX - this.x) * 0.01;
                this.vy += (orbitY - this.y) * 0.01;
                
                // Apply velocity with damping
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx;
                this.y += this.vy;
                
                // Boundary wrapping
                if (this.x < 0) this.x = window.innerWidth;
                if (this.x > window.innerWidth) this.x = 0;
                if (this.y < 0) this.y = window.innerHeight;
                if (this.y > window.innerHeight) this.y = 0;
                
                // Life decay
                this.life -= this.decay;
                if (this.life < 0) this.life = 0;
            }
            
            render(ctx) {
                const alpha = this.life;
                
                // Outer glow
                const glowGradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 3
                );
                glowGradient.addColorStop(0, this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0'));
                glowGradient.addColorStop(1, this.color + '00');
                
                ctx.fillStyle = glowGradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Core particle
                ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner highlight
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (alpha * 0.8) + ')';
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // FPS Counter
        let fps = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        
        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
            requestAnimationFrame(updateFPS);
        }
        
        // Initialize the experience
        window.addEventListener('load', () => {
            new CosmicNeuralExperience();
            updateFPS();
        });
        
        // Prevent context menu
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
